<h2>Tasks</h2>

<p *ngIf="errorMessage">{{ errorMessage }}</p>

<ng-container *ngIf="!errorMessage">
  <ng-container *ngIf="tasks$ | async as tasks">
    <p *ngIf="tasks.length === 0">No tasks found.</p>

    <ul *ngIf="tasks.length > 0">
      <li *ngFor="let t of tasks">{{ t.title }}</li>
    </ul>
  </ng-container>
</ng-container>

<h2>Search Tasks</h2>

<input [(ngModel)]="query" placeholder="Search..." />
<button (click)="search()">Search</button>

<p *ngIf="errorMessage">{{ errorMessage }}</p>

<p *ngIf="!errorMessage && results.length === 0">No results.</p>

<ul *ngIf="!errorMessage && results.length > 0">
  <li *ngFor="let t of results">{{ t.title }}</li>
</ul>

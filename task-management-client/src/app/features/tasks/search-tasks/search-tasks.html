<div class="page">
  <h2>Search Tasks</h2>

  <label for="query">Search</label>
  <input id="query" type="text" name="query" [(ngModel)]="query" placeholder="Enter search term" />

  <button type="button" (click)="search()">Search</button>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <ul *ngIf="results.length > 0">
    <li *ngFor="let task of results">
      {{ task.title }}
    </li>
  </ul>

  <p *ngIf="hasSearched && !errorMessage && results.length === 0">No results.</p>

  <button type="button" class="back-btn" routerLink="/">Return to Home Page</button>
</div>

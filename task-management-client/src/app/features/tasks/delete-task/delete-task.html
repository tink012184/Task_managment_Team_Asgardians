<div class="page">
  <div class="card">
    <h1 class="page-title">Delete Task by ID</h1>

    <div class="form-group">
      <label for="taskId">Task ID</label>
      <input id="taskId" type="text" class="input" [(ngModel)]="taskId" placeholder="Enter task ID" />
    </div>

    <div class="button-row">
      <button type="button" class="btn btn-primary" (click)="onDelete()">Delete Task</button>
    </div>

    <p *ngIf="message">{{ message }}</p>
  </div>
</div>

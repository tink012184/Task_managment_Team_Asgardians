<div class="project-search-container">
  <h2>Search Projects</h2>

  <div class="search-bar">
    <input type="text" [(ngModel)]="query" placeholder="Search projects..." class="search-input" />

    <button type="button" (click)="search()" class="search-button">Search</button>
  </div>

  <p *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </p>

  <p *ngIf="message && !errorMessage" class="info-message">
    {{ message }}
  </p>

  <ul *ngIf="results.length > 0" class="results-list">
    <li *ngFor="let project of results">
      <strong>{{ project.name }}</strong>
    </li>
  </ul>
</div>

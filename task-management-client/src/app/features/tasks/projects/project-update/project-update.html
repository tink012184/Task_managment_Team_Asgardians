<div class="project-update-container">
  <div class="header">
    <button class="back-button" type="button" (click)="returnToMain()">← Back to Main</button>
    <h2>Update Project</h2>
  </div>

  <div class="message success" *ngIf="message && messageType === 'success'">
    {{ message }}
  </div>

  <div class="message error" *ngIf="message && messageType === 'error'">
    {{ message }}
  </div>

  <div class="form-group">
    <label for="projectSelect">Select a Project</label>
    <select id="projectSelect" name="projectSelect" [(ngModel)]="selectedProjectId">
      <option value="">
        {{ loadingProjects ? 'Loading projects...' : '-- Select a Project --' }}
      </option>
      <option *ngFor="let project of projects" [value]="project._id">
        {{ project.name }}
      </option>
    </select>
  </div>

  <button type="button" (click)="loadProject()" [disabled]="!selectedProjectId || loadingProject">
    {{ loadingProject ? 'Loading Project...' : 'Load Project' }}
  </button>

  <form *ngIf="projectLoaded" (ngSubmit)="updateProject()">
    <div class="form-group">
      <label for="name">Project Name</label>
      <input id="name" name="name" [(ngModel)]="project.name" />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" [(ngModel)]="project.description"></textarea>
    </div>

    <div class="form-group">
      <label for="startDate">Start Date</label>
      <input id="startDate" name="startDate" type="date" [(ngModel)]="project.startDate" />
    </div>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Updating...' : 'Update Project' }}
    </button>
  </form>
</div>

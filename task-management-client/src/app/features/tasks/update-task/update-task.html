<div class="page">
  <h2>Update Task</h2>

  <label for="taskSelect">Select Task</label>
  <select
    id="taskSelect"
    name="taskSelect"
    [(ngModel)]="selectedTaskId"
    (ngModelChange)="onTaskSelected()"
    [disabled]="loadingTasks"
  >
    <option value="">
      {{ loadingTasks ? 'Loading tasks...' : '-- Select a Task --' }}
    </option>
    <option *ngFor="let item of tasks" [value]="item._id">
      {{ item.title }}
    </option>
  </select>

  <p class="success" *ngIf="messageType === 'success'">{{ message }}</p>
  <p class="error" *ngIf="messageType === 'error'">{{ message }}</p>

  <form *ngIf="taskLoaded" (ngSubmit)="updateTask($event)">
    <label for="title">Title</label>
    <input id="title" type="text" name="title" [(ngModel)]="task.title" required />

    <label for="description">Description</label>
    <textarea id="description" name="description" [(ngModel)]="task.description"></textarea>

    <label for="status">Status</label>
    <input id="status" type="text" name="status" [(ngModel)]="task.status" required />

    <label for="priority">Priority</label>
    <input id="priority" type="text" name="priority" [(ngModel)]="task.priority" required />

    <label for="dueDate">Due Date</label>
    <input id="dueDate" type="date" name="dueDate" [(ngModel)]="task.dueDate" />

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Updating...' : 'Update Task' }}
    </button>
  </form>

  <button type="button" class="back-btn" (click)="returnToMain()">Return to Home Page</button>
</div>

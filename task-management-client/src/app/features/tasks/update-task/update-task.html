<div class="page">
  <h2>Update Task</h2>

  @if (message) {
    <div
      class="message"
      [class.success]="messageType === 'success'"
      [class.error]="messageType === 'error'"
    >
      {{ message }}
    </div>
  }

  <form class="card" (submit)="loadTask($event)" novalidate>
    <div class="row">
      <div class="form-group">
        <label for="taskId">Task ID</label>
        <input
          id="taskId"
          name="taskId"
          type="text"
          [(ngModel)]="taskId"
          placeholder="Paste the Task _id here"
        />
      </div>

      <button class="btn" type="submit" [disabled]="loading">
        @if (loading) {
          Loading...
        } @else {
          Load Task
        }
      </button>
    </div>
  </form>

  @if (task) {
    <form class="card" (submit)="saveTask($event)" novalidate>
      <div class="form-group">
        <label for="title">Title *</label>
        <input id="title" name="title" type="text" [(ngModel)]="task.title" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          rows="4"
          [(ngModel)]="task.description"
        ></textarea>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" name="status" [(ngModel)]="task.status" required>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Complete">Complete</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority *</label>
          <select id="priority" name="priority" [(ngModel)]="task.priority" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" type="submit" [disabled]="loading">
          @if (loading) {
            Saving...
          } @else {
            Save Changes
          }
        </button>

        <button class="btn" type="button" (click)="returnToMain()">Return to Main Page</button>
      </div>
    </form>
  }
</div>

<div class="page">
  <h2>Update Task</h2>

  <label for="taskId">Task ID</label>
  <input id="taskId" type="text" name="taskId" [(ngModel)]="taskId" placeholder="Enter task ID" />

  <button type="button" (click)="loadTask()">Load Task</button>

  <p class="success" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <form *ngIf="taskLoaded && task" (ngSubmit)="updateTask($event)">
    <label for="title">Title</label>
    <input id="title" type="text" name="title" [(ngModel)]="task.title" required />

    <label for="description">Description</label>
    <textarea id="description" name="description" [(ngModel)]="task.description"></textarea>

    <label for="status">Status</label>
    <input id="status" type="text" name="status" [(ngModel)]="task.status" required />

    <label for="priority">Priority</label>
    <input id="priority" type="text" name="priority" [(ngModel)]="task.priority" required />

    <label for="dueDate">Due Date</label>
    <input id="dueDate" type="date" name="dueDate" [(ngModel)]="task.dueDate" />

    <label for="assignedTo">Assigned To</label>
    <input id="assignedTo" type="text" name="assignedTo" [(ngModel)]="task.assignedTo" />

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Updating...' : 'Update Task' }}
    </button>
  </form>

  <button type="button" class="back-btn" (click)="returnToMain()">Return to Home Page</button>
</div>

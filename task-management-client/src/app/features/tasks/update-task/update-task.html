<div class="update-task-container">
  <div class="header">
    <button class="back-button" type="button" routerLink="/">← Back to Main</button>
    <h2>Update Task</h2>
  </div>

  <div class="message success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="message error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <label for="taskSelect">Select a Task</label>

    <select
      id="taskSelect"
      name="taskSelect"
      [ngModel]="selectedTaskId"
      (ngModelChange)="onTaskSelected($event)"
    >
      <option value="">
        {{ loadingTasks ? 'Loading tasks...' : '-- Select a Task --' }}
      </option>

      <option *ngFor="let task of tasks" [value]="task._id">
        {{ task.title }}
      </option>
    </select>
  </div>

  <div *ngIf="loadingTask">Loading selected task...</div>

  <form *ngIf="selectedTask" (ngSubmit)="updateTask()">
    <div class="form-group">
      <label for="title">Title</label>
      <input id="title" name="title" [(ngModel)]="selectedTask.title" />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="selectedTask.description"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" name="status" [(ngModel)]="selectedTask.status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <div class="form-group">
      <label for="priority">Priority</label>
      <select id="priority" name="priority" [(ngModel)]="selectedTask.priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dueDate">Due Date</label>
      <input id="dueDate" name="dueDate" type="date" [(ngModel)]="selectedTask.dueDate" />
    </div>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Updating...' : 'Update Task' }}
    </button>
  </form>
</div>
